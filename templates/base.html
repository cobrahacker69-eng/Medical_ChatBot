<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medical AI Advisor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Serif+4:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-mark">+</div>
                <div>
                    <p class="eyebrow">Digital Health Assistant</p>
                    <h1 class="brand">MedInsight AI</h1>
                </div>
            </div>
            <nav class="menu">
                <a class="menu-link {% if request.path == '/' %}is-active{% endif %}" href="/">Dashboard</a>
                <a class="menu-link {% if request.path == '/emergency' %}is-active{% endif %}" href="/emergency">Emergency</a>
                <a class="menu-link {% if request.path == '/reports' %}is-active{% endif %}" href="/reports">Reports</a>
                <a class="menu-link {% if request.path == '/settings' %}is-active{% endif %}" href="/settings">Settings</a>
            </nav>
            <div class="sidebar-card">
                <h2>Care Overview</h2>
                <p>Track symptoms, review triage guidance, and escalate urgent cases quickly.</p>
            </div>
        </aside>

        <main class="main-container">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Patient Support</p>
                    <h2>{% block page_title %}Medical AI Advisor{% endblock %}</h2>
                </div>
                <div class="status-pill">System online</div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
